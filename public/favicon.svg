<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- HarvestPad. Keep in sync with LogoGlyph in src/components/icons.tsx. -->
  <style>
    .tile { fill: #e8ebf0 }
    .pad  { fill: #1b1f27 }
    .stalk{ fill: #5c6675 }
    .grain{ fill: #1d4fd8 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #262b33 }
      .pad  { fill: #edf0f5 }
      .stalk{ fill: #9ba5b7 }
      .grain{ fill: #7c9dff }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <g transform="translate(16 16) scale(0.82) translate(-16 -16)">
    <circle class="grain" cx="22.25" cy="5" r="2.25"/>
    <rect class="stalk" x="8" y="17" width="3.5" height="5.5" rx="1.75"/>
    <rect class="stalk" x="14.25" y="13" width="3.5" height="9.5" rx="1.75"/>
    <rect class="grain" x="20.5" y="8.5" width="3.5" height="14" rx="1.75"/>
    <rect class="pad" x="6" y="24" width="20" height="3.5" rx="1.75"/>
  </g>
</svg>
